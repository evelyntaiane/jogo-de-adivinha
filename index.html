<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação de Palavras</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="jogo">
        <h1>Adivinhe a Palavra</h1>
        <p class="introducao">Descubra a palavra antes que suas tentativas acabem!</p>

        <p class="categoria">Categoria: <span id="categoria">-</span></p>
        <p class="dica">Dica: <span id="dica">-</span></p>

        <p id="palavra" aria-live="polite">_ _ _ _ _</p>

        <p class="tentativas">
            Tentativas restantes: <strong id="tentativas">6</strong>
        </p>

        <div class="campo">
            <label for="letra">Digite uma letra:</label>
            <input id="letra" type="text" maxlength="1" autocomplete="off">
            <button id="btn-tentar" type="button">Tentar</button>
        </div>

        <p id="mensagem" role="status" aria-live="polite">Boa sorte!</p>

        <p class="usadas">Letras utilizadas: <span id="letras-usadas">Nenhuma</span></p>

        <button id="btn-reiniciar" class="reiniciar" type="button">Nova partida</button>
    </main>
</body>
</html>
